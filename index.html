<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>多益擂台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  /* 版面概念：整個遊戲是一張多益答案卡。左緣有計時標記，選項是要塗滿的圓圈，HP 是兩條對峙的墨條。 */
  --bg:#E4E8EE; --paper:#F7F8FA; --ink:#1B2130; --ink2:#5A6478; --line:#C9D0DC;
  --print:#D6336C; --print-soft:#FBE3EC; --on-print:#FFFFFF;
  --you:#0E7C86; --foe:#6741D9;
  --good:#2B8A3E; --good-soft:#DDF3E2; --bad:#E03131; --bad-soft:#FBE0E0;
  --r0:#5A6478; --r1:#0E7C86; --r2:#6741D9; --r3:#B86E00;
  --shadow:rgba(27,33,48,.14);
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F121A; --paper:#181D29; --ink:#E8ECF4; --ink2:#9AA5BA; --line:#2C3446;
  --print:#FF6B9A; --print-soft:#3B1D2A; --on-print:#1B0A12;
  --you:#3CC4CF; --foe:#A78BFA;
  --good:#51CF66; --good-soft:#16301D; --bad:#FF6B6B; --bad-soft:#3A1B1D;
  --r0:#9AA5BA; --r1:#3CC4CF; --r2:#A78BFA; --r3:#F5A524; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121A; --paper:#181D29; --ink:#E8ECF4; --ink2:#9AA5BA; --line:#2C3446;
  --print:#FF6B9A; --print-soft:#3B1D2A; --on-print:#1B0A12;
  --you:#3CC4CF; --foe:#A78BFA;
  --good:#51CF66; --good-soft:#16301D; --bad:#FF6B6B; --bad-soft:#3A1B1D;
  --r0:#9AA5BA; --r1:#3CC4CF; --r2:#A78BFA; --r3:#F5A524; --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.shell{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-block-end:14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font:800 26px/1 var(--f-display);letter-spacing:.02em}
.brand span{font:600 11px var(--f-mono);letter-spacing:.16em;color:var(--print)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 12px var(--f-mono);padding:4px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}

.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 16px 18px 36px;box-shadow:0 1px 0 var(--line),0 10px 26px -18px var(--shadow)}
.sheet::before{content:"";position:absolute;left:13px;top:16px;bottom:16px;width:9px;background:repeating-linear-gradient(to bottom,var(--ink) 0 5px,transparent 5px 14px);opacity:.7}
.stack{display:grid;gap:16px}
.stack>*{min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.h{font:800 21px/1.2 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-block-end:6px}
.muted{color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.g{color:var(--good)}.b{color:var(--bad)}
p{margin:0}

.btn{border:0;background:var(--print);color:var(--on-print);font-weight:700;padding:12px 22px;border-radius:6px;letter-spacing:.04em}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.choice b{font-weight:700}
.choice small{opacity:.75;font-size:12px}
.choice:hover{border-color:var(--ink)}
.choice[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.fighter{position:relative;display:grid;gap:4px;min-width:0}
.fighter .nm{font:800 16px/1.25 var(--f-display);overflow-wrap:anywhere}
.fighter.foe{text-align:right}
.hp{height:16px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.hp i{position:absolute;top:0;bottom:0;display:block;width:100%;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.you .hp i{left:0;background:var(--you)}
.foe .hp i{right:0;background:var(--foe)}
.hpnum{font:600 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.mid{display:grid;justify-items:center;gap:2px;padding-top:2px;min-width:54px}
.mid b{font:800 24px/1 var(--f-display)}
.mid small{font:600 10px var(--f-mono);letter-spacing:.12em;color:var(--ink2);min-height:14px}
.float{position:absolute;top:-4px;font:800 24px var(--f-display);pointer-events:none;animation:rise 1s ease-out forwards}
.you .float{left:0}.foe .float{right:0}
.float.dmg{color:var(--bad)}.float.heal{color:var(--good)}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--print);transition:width .1s linear}
.timer.low i{background:var(--bad)}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-block-end:10px}
.tag{font:600 11px var(--f-mono);letter-spacing:.08em;padding:2px 8px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap}
.stem{font-size:17px;line-height:1.75;margin-block-end:14px;overflow-wrap:anywhere;white-space:pre-line}
.blank{display:inline-block;width:3.4em;border-bottom:2px solid var(--ink);margin-inline:.2em;transform:translateY(-2px)}
.passage{max-height:38vh;overflow:auto;white-space:pre-line;font-size:14px;line-height:1.75;border:1px dashed var(--ink2);border-radius:4px;padding:10px 12px;margin-block-end:14px;background:var(--bg)}
.passage .mono{display:block;font-size:11px;letter-spacing:.14em;color:var(--print);margin-block-end:4px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 12px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;min-width:0}
.opt span:last-child{overflow-wrap:anywhere}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--print);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--print)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:hover:not(:disabled) .bub{background:var(--print-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{display:grid;gap:8px}
.fbline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.exp{font-size:14px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px;white-space:pre-line}
.notes{display:flex;gap:6px;flex-wrap:wrap}
.notes .tag{color:var(--foe)}
.banner{background:var(--print);color:var(--on-print);font-weight:700;padding:8px 12px;border-radius:4px;letter-spacing:.06em}

.item{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:4px;background:var(--paper);align-content:start;min-width:0}
.item.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.item.locked{opacity:.55}
.item .nm{font-weight:700}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px dashed var(--ink2);border-radius:6px;padding:8px;text-align:center;font-size:13px;min-width:0;overflow-wrap:anywhere}
.slot small{display:block;font:600 10px var(--f-mono);letter-spacing:.12em;color:var(--ink2)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--print)}
.ach.done .prog i{background:var(--good)}
.ach.done .nm::after{content:" ✓";color:var(--good)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1.5px solid var(--line);border-radius:6px;text-align:center;padding:8px 0;font:600 12px var(--f-mono)}
.day.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day.today{border-color:var(--print)}
.big{font:800 44px/1 var(--f-display)}
.num{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.stats div{display:grid;gap:2px}
.stats small{font:600 11px var(--f-mono);letter-spacing:.1em;color:var(--ink2)}

.inp{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.word{border-bottom:1px dashed var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.word .w{font:800 19px var(--f-display)}
.word .ex{grid-column:1/-1;font-size:13px}
.star{background:none;border:0;font-size:22px;line-height:1;color:var(--line);padding:0 4px}
.star[aria-pressed="true"]{color:var(--r3)}
.hidezh .zh:not(.show){filter:blur(6px);cursor:pointer}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--paper);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav-in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:760px}
.nav button{background:none;border:0;padding:13px 2px 11px;font-weight:700;font-size:13px;color:var(--ink2);position:relative}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:28%;right:28%;top:0;height:3px;background:var(--print)}
.dot{position:absolute;top:9px;right:20%;width:7px;height:7px;border-radius:50%;background:var(--print)}
body.inb .nav{display:none}
body.inb .shell{padding-block-end:30px}

.ov{position:fixed;inset:0;background:rgba(10,12,20,.62);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.dlg{width:min(480px,100%);max-height:92%;overflow:auto;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:20px;display:grid;gap:14px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-weight:700;font-size:13px;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.stem{font-size:16px}.sheet{padding-left:32px}}
</style>
<div class="shell">
  <header class="top">
    <div class="brand"><b>多益擂台</b><span>TOEIC DUEL</span></div>

  </header>
  <main id="view"></main>
</div>
<nav class="nav"><div class="nav-in" id="nav">
  <button data-act="nav" data-v="lobby">對戰</button>

</div></nav>
<div id="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>

/* ===== 題庫：文法（-------為空格） ===== */
const GRAM=[

/* 出題：統一回傳 {id,type,ref,stem,opts,ans,exp,passage,ptag} */
function mk(o,ref){
  const idx=shuffle(o.opts.map((_,i)=>i));
  o.ans=idx.indexOf(o.ans);
  o.opts=idx.map(i=>o.opts[i]);
  o.ref=ref;
  return o;
}
function buildQ(type,ref){
  if(type==='grammar'){
    const g=GRAM[ref];
    return mk({id:'g'+ref,type,stem:g[0],opts:g[1].slice(),ans:g[2],exp:g[3]},ref);
  }
  if(type==='reading'){
    const R=READ[ref[0]],q=R.qs[ref[1]];
    return mk({id:'r'+ref[0]+'-'+ref[1],type,passage:R.tx,ptag:R.t,stem:q[0],opts:q[1].slice(),ans:q[2],exp:q[3]},ref);
  }
  const wi=ref[0],mode=ref[1],w=VOCAB[wi];
  let pool=VOCAB.map((v,i)=>i).filter(i=>i!==wi&&VOCAB[i][1]===w[1]);
  pool=shuffle(pool).slice(0,3);
  const opts=[w[0]].concat(pool.map(i=>VOCAB[i][0]));
  const exp=w[0]+'（'+w[1]+'）：'+w[2]+'\n例句：'+w[3]+'\n'+w[4];
  let stem;
  if(mode===0){
    const re=new RegExp(w[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    stem=w[3].replace(re,'-------');
  }else stem='「'+w[2]+'」的英文是？';
  return mk({id:'v'+wi+':'+mode,type,stem,opts,ans:0,exp},ref);
}
const QUEUES={};
function nextRef(type){
  if(!QUEUES[type]||!QUEUES[type].length){
    let all;
    if(type==='grammar')all=GRAM.map((_,i)=>i);
    else if(type==='reading'){all=[];READ.forEach((r,p)=>r.qs.forEach((_,i)=>all.push([p,i])));}
    else all=VOCAB.map((_,i)=>[i,Math.random()<.7?0:1]);
    QUEUES[type]=shuffle(all);
  }
  return QUEUES[type].pop();
}
function addWrong(q){
  const e=S.wrong[q.id];
  if(e){e.n++;e.ok=0;}else S.wrong[q.id]={id:q.id,type:q.type,ref:q.ref,n:1,ok:0};
}

let toastQ=[],toastBusy=false;
function toast(msg){toastQ.push(msg);if(!toastBusy)nextToast();}
function nextToast(){

  if(!toastQ.length){toastBusy=false;el.hidden=true;return;}
  toastBusy=true;el.textContent=toastQ.shift();el.hidden=false;

function dlg(html){const o=$('#overlay');o.innerHTML='<div class="ov"><div class="dlg">'+html+'</div></div>';o.hidden=false;}
function closeDlg(){const o=$('#overlay');o.hidden=true;o.innerHTML='';}

let MODE=null,B=null,RV=null,timer=null;

function qHTML(q,label,right){
  return '<div class="qmeta"><span class="tag" style="color:var(--print)">'+esc(label)+'</span><span class="tag muted">'+esc(right)+'</span></div>'
   +(q.passage?'<div class="passage"><span class="mono">'+esc(q.ptag)+'</span>'+esc(q.passage)+'</div>':'')
   +'<p class="stem">'+stemHTML(q.stem)+'</p>'
   +'<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-act="ans" data-i="'+i+'"><span class="bub">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></button>').join('')+'</div>';

function markOpts(q,pick){
  document.querySelectorAll('#qbox .opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans)b.classList.add('ok');else if(i===pick)b.classList.add('no');
  });
}
function expHTML(q){return '<div class="exp">正確答案 '+'ABCD'[q.ans]+'\n'+esc(q.exp)+'</div>';}

function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function startTimer(sec,onEnd){
  stopTimer();
  const t0=Date.now(),fill=$('#tfill'),box=$('#tbox'),num=$('#tnum');
  fill.style.width='100%';box.classList.remove('low');
  timer=setInterval(()=>{
    const left=sec-(Date.now()-t0)/1000;
    if(left<=0){stopTimer();fill.style.width='0%';num.textContent='0';onEnd();return;}
    fill.style.width=(left/sec*100)+'%';
    box.classList.toggle('low',left<=5);
    num.textContent=Math.ceil(left)+' 秒';
  },100);
}

/* ---------- 對戰 ---------- */
function startBattle(){
  const F=fx(),types=S.types.filter(k=>TYPES[k]),diff=S.diff;
  B={types:types.length?types:['grammar'],type:null,diff,F,pMax:50+F.hp,pHP:50+F.hp,aMax:50,aHP:50,round:0,combo:0,rageCnt:0,rageReady:false,
     correct:0,total:0,used:false,phase:'q',cur:null,over:false,result:null};
  MODE='battle';
  mountBattle();
  if(F.first){B.aHP=Math.max(1,B.aMax-F.first);updateHP();floatAt('ff','-'+F.first,'dmg');toast('先制徽章發動：對手 −'+F.first);}
  nextQuestion();
}
function mountBattle(){

function updateHP(){
  $('#pbar').style.width=(B.pHP/B.pMax*100)+'%';
  $('#abar').style.width=(B.aHP/B.aMax*100)+'%';
  $('#pnum').textContent='HP '+B.pHP+' / '+B.pMax;
  $('#anum').textContent='HP '+B.aHP+' / '+B.aMax;
  $('#cmb').textContent=B.combo>=2?B.combo+' 連擊':'';
}
function floatAt(id,text,cls){
  const el=document.getElementById(id);if(!el)return;
  const s=document.createElement('span');s.className='float '+cls;s.textContent=text;el.appendChild(s);
  el.classList.remove('hit');void el.offsetWidth;if(cls==='dmg')el.classList.add('hit');
  setTimeout(()=>s.remove(),1000);
}
function nextQuestion(){
  B.round++;B.phase='q';
  B.type=B.types[Math.floor(Math.random()*B.types.length)];
  B.cur=buildQ(B.type,nextRef(B.type));
  if(B.cur.type==='vocab')S.seen[B.cur.ref[0]]=1;
  $('#rnd').textContent=B.round;
  $('#qbox').innerHTML=qHTML(B.cur,TYPES[B.type].n,'傷害 '+TYPES[B.type].dmg);
  $('#fb').innerHTML='';
  startTimer(TYPES[B.type].t,()=>battleAnswer(-1));
}
function battleAnswer(i){
  if(!B||B.over)return;
  if(B.phase==='special'){specialAnswer(i);return;}
  if(B.phase!=='q')return;
  B.phase='resolved';stopTimer();
  const q=B.cur,ok=i===q.ans,F=B.F,T=TYPES[B.type];
  markOpts(q,i);
  S.correct[B.type]+=ok?1:0;bumpDay(ok);
  if(!ok)addWrong(q);
  B.total++;
  const aOk=Math.random()<(DIFF[B.diff].acc-(B.type==='reading'?.06:0));
  let pd=0,ad=0,reflect=0,heal=0;const notes=[];
  if(ok){
    B.correct++;B.combo++;
    pd=T.dmg+F.atk+(F.combo?Math.min(B.combo-1,F.combo):0);
    let m=1;
    if(F.rage){
      if(B.rageReady){m*=2;B.rageReady=false;B.rageCnt=0;notes.push('怒氣爆發 ×2');}
      else{B.rageCnt++;if(B.rageCnt>=F.rage)B.rageReady=true;}
    }
    if(F.crit&&Math.random()<F.crit){m*=2;notes.push('暴擊 ×2');}
    if(F.exec&&B.aHP<=B.aMax*F.exec){m*=2;notes.push('處決 ×2');}
    if(F.combo&&B.combo>=2)notes.push('連擊加成 +'+Math.min(B.combo-1,F.combo));
    pd=Math.max(1,Math.round(pd*m));
    heal=F.heal;
  }else{B.combo=0;B.rageCnt=0;B.rageReady=false;}
  if(aOk){ad=Math.max(1,T.dmg-F.guard);if(F.thorn){reflect=F.thorn;notes.push('荊棘反彈 '+F.thorn);}}
  B.aHP=Math.max(0,B.aHP-pd-reflect);
  if(heal)B.pHP=Math.min(B.pMax,B.pHP+heal);
  B.pHP=Math.max(0,B.pHP-ad);
  updateHP();
  if(pd)floatAt('ff','-'+(pd+reflect),'dmg');else if(reflect)floatAt('ff','-'+reflect,'dmg');
  if(ad)floatAt('fy','-'+ad,'dmg');
  if(heal&&ad<=0)floatAt('fy','+'+heal,'heal');
  save();
  const foe=DIFF[B.diff].foe;
  let html='<div class="fbline"><b class="'+(ok?'g':'b')+'">'+(i===-1?'時間到':ok?'答對':'答錯')+'</b><span>'+(ok?'對手 −'+pd:'沒有命中')+'</span></div>'
   +'<div class="fbline"><b class="'+(aOk?'b':'g')+'">'+esc(foe)+(aOk?' 答對':' 答錯')+'</b><span>'+(aOk?'你 −'+ad:'沒有命中')+'</span></div>'
   +(notes.length?'<div class="notes">'+notes.map(n=>'<span class="tag">'+esc(n)+'</span>').join('')+'</div>':'')
   +expHTML(q);
  const pDead=B.pHP<=0,aDead=B.aHP<=0;
  if(pDead&&aDead)return finish('draw',html);
  if(aDead)return finish('win',html);
  if(pDead){
    if((F.last||F.rev)&&!B.used){
      B.phase='special';
      $('#fb').innerHTML=html+'<div class="banner">'+(F.last?'背水一戰':'鳳凰之羽')+'發動！答對這題特殊題，'+(F.last?'對手將承受 '+F.last+' 點傷害':'你將以一半 HP 復活')+'。</div><button class="btn wide" data-act="special">挑戰特殊題</button>';
      return;
    }
    return finish('lose',html);
  }
  $('#fb').innerHTML=html+'<button class="btn wide" data-act="next">下一題</button>';
}
function startSpecial(){
  B.used=true;
  B.type=B.types[Math.floor(Math.random()*B.types.length)];
  B.cur=buildQ(B.type,nextRef(B.type));
  $('#qbox').innerHTML='<div class="banner" style="margin-block-end:12px">特殊題</div>'+qHTML(B.cur,TYPES[B.type].n,'只有一次機會');
  $('#fb').innerHTML='';
  B.phase='special';
  startTimer(TYPES[B.type].t,()=>specialAnswer(-1));
}
function specialAnswer(i){
  if(!B||B.over||B.phase!=='special'||!B.used)return;
  B.phase='resolved';stopTimer();
  const q=B.cur,ok=i===q.ans,F=B.F;
  markOpts(q,i);
  S.correct[B.type]+=ok?1:0;bumpDay(ok);
  if(!ok)addWrong(q);
  let html='<div class="fbline"><b class="'+(ok?'g':'b')+'">'+(i===-1?'時間到':ok?'特殊題答對':'特殊題答錯')+'</b></div>'+expHTML(q);
  if(ok&&F.last){
    B.aHP=Math.max(0,B.aHP-F.last);updateHP();floatAt('ff','-'+F.last,'dmg');
    return finish(B.aHP<=0?'win':'lose',html,B.aHP<=0);
  }
  if(ok&&F.rev){
    B.pHP=Math.round(B.pMax*F.rev);updateHP();floatAt('fy','復活','heal');
    $('#fb').innerHTML=html+'<div class="banner">你以 '+B.pHP+' HP 復活了！</div><button class="btn wide" data-act="next">下一題</button>';
    return;
  }
  finish('lose',html);
}
function finish(result,html,viaLast){
  B.over=true;B.result=result;stopTimer();
  let reward=0,perfect=false,comeback=false;
  S.battles++;
  if(result==='win'){
    S.wins++;S.winStreak++;S.bestWin=Math.max(S.bestWin,S.winStreak);
    B.types.forEach(k=>S.winsBy[k]++);S.winsDiff[B.diff]++;
    perfect=B.correct===B.total&&B.total>=5;
    if(perfect){S.perfect++;}
    comeback=B.pHP<=10||!!viaLast;
    if(comeback)S.comeback++;
    reward=30+DIFF[B.diff].bonus+(perfect?20:0);
    reward=Math.floor(reward*(1+B.F.gold));
  }else if(result==='draw'){S.draws++;S.winStreak=0;reward=15;}
  else{S.losses++;S.winStreak=0;reward=B.quit?0:8;}
  B.reward=reward;B.perfect=perfect;
  addCoins(reward);save();
  $('#fb').innerHTML=html+'<button class="btn wide" data-act="result">查看結算</button>';
  setTimeout(()=>{if(MODE==='battle'&&B&&B.over)showResult();},1800);
}
function showResult(){
  if(!B)return;
  const r=B.result,T=r==='win'?'勝利':r==='draw'?'同歸於盡':'落敗';
  const acc=B.total?Math.round(B.correct/B.total*100):0;
  dlg('<div><div class="eyebrow">'+esc(B.types.map(k=>TYPES[k].n).join('＋'))+' · '+esc(DIFF[B.diff].n)+'</div><div class="big" style="color:var(--'+(r==='win'?'good':r==='draw'?'ink2':'bad')+')">'+T+'</div></div>'
   +'<div class="stats"><div><small>回合</small><span class="num">'+B.round+'</span></div><div><small>答對</small><span class="num">'+B.correct+'/'+B.total+'</span></div><div><small>正確率</small><span class="num">'+acc+'%</span></div></div>'
   +'<p>獲得 <b class="mono">'+B.reward+'</b> 金幣'+(B.perfect?'（含全對獎勵）':'')+'。答錯的題目已放進錯題本。</p>'
   +'<div class="row"><button class="btn" data-act="again">再戰一場</button><button class="btn ghost" data-act="lobby">回大廳</button></div>');
  checkAch();renderTop();
}
function leaveBattle(){
  stopTimer();MODE=null;B=null;closeDlg();document.body.classList.remove('inb');V='lobby';render();
}
function askQuit(){
  dlg('<h2 class="h">要放棄這場對戰嗎？</h2><p class="muted">放棄會算一場落敗，而且拿不到金幣。</p><div class="row"><button class="btn" data-act="quitYes">放棄</button><button class="btn ghost" data-act="close">繼續對戰</button></div>');
}
function quitBattle(){
  closeDlg();
  if(B&&!B.over){B.quit=true;B.phase='resolved';finish('lose','');closeDlg();leaveBattle();toast('已放棄對戰');}
  else leaveBattle();
}

/* ---------- 錯題複習 ---------- */
function startReview(){
  const list=shuffle(Object.keys(S.wrong)).slice(0,10);
  if(!list.length){toast('錯題本是空的');return;}
  RV={list,i:0,ok:0,done:false,cur:null,locked:false};
  MODE='review';
  document.body.classList.add('inb');
  $('#view').innerHTML='<section class="sheet stack"><div class="row between"><div><div class="eyebrow">Review</div><h2 class="h">錯題複習 <span class="mono muted" id="rvn"></span></h2></div><button class="btn ghost sm" data-act="rvExit">結束</button></div><div id="qbox"></div><div id="fb" class="fb"></div></section>';
  nextReview();
}
function nextReview(){
  if(RV.i>=RV.list.length){return endReview();}
  const e=S.wrong[RV.list[RV.i]];
  if(!e){RV.i++;return nextReview();}
  RV.cur=buildQ(e.type,e.ref);RV.locked=false;
  if(RV.cur.type==='vocab')S.seen[RV.cur.ref[0]]=1;
  $('#rvn').textContent=(RV.i+1)+' / '+RV.list.length;
  $('#qbox').innerHTML=qHTML(RV.cur,TYPES[e.type].n,'再答對 '+(2-e.ok)+' 次移出');
  $('#fb').innerHTML='';
}
function reviewAnswer(i){
  if(!RV||RV.locked)return;
  RV.locked=true;
  const q=RV.cur,ok=i===q.ans,e=S.wrong[q.id];
  markOpts(q,i);
  S.correct[q.type]+=ok?1:0;bumpDay(ok);
  let msg;
  if(ok){
    RV.ok++;addCoins(2);
    if(e){e.ok++;if(e.ok>=2){delete S.wrong[q.id];S.mastered++;msg='這題已掌握，從錯題本移出。';}else msg='再答對一次就能移出。';}
  }else{if(e){e.n++;e.ok=0;}msg='答錯了，連續答對次數歸零。';}
  save();renderTop();
  RV.i++;
  $('#fb').innerHTML='<div class="fbline"><b class="'+(ok?'g':'b')+'">'+(ok?'答對 +2 金幣':'答錯')+'</b><span>'+esc(msg||'')+'</span></div>'+expHTML(q)
   +'<button class="btn wide" data-act="rvNext">'+(RV.i>=RV.list.length?'查看結果':'下一題')+'</button>';
}
function endReview(){
  const n=RV.list.length,ok=RV.ok;
  MODE=null;document.body.classList.remove('inb');checkAch();
  dlg('<h2 class="h">複習完成</h2><p>這一輪答對 <b class="mono">'+ok+' / '+n+'</b> 題，錯題本還剩 <b class="mono">'+Object.keys(S.wrong).length+'</b> 題。</p><div class="row"><button class="btn" data-act="rvDone">回錯題本</button></div>');
  RV=null;
}

   +'<input class="inp" id="vq" type="search" placeholder="搜尋英文或中文" value="'+esc(VF.q)+'">'
   +'<div class="choices">'+f('all','全部')+f('fav','收藏')+f('bad','易錯')+'</div>'
   +'<label class="row" style="font-size:14px"><input type="checkbox" id="vhide"'+(VF.hide?' checked':'')+'> 遮住中文，點一下才顯示（自我測驗）</label>'
   +'<div id="wlist" class="'+(VF.hide?'hidezh':'')+'">'+wordsHTML()+'</div></section>';
}

function itemCard(it){
  const own=!!S.items[it.id],on=S.equip[it.slot]===it.id;
  if(!own)return '<div class="item locked"><div class="mono r'+it.r+'" style="font-size:12px">'+RN[it.r]+' · '+SLOT[it.slot]+'</div><div class="nm">？？？</div><div class="muted" style="font-size:13px">尚未獲得</div></div>';
  return '<div class="item'+(on?' on':'')+'"><div class="mono r'+it.r+'" style="font-size:12px">'+RN[it.r]+' · '+SLOT[it.slot]+'</div><div class="nm">'+esc(it.name)+'</div><div class="muted" style="font-size:13px">'+esc(it.desc)+'</div>'
   +'<div><button class="btn sm'+(on?' ghost':'')+'" data-act="equip" data-id="'+it.id+'">'+(on?'卸下':'裝備')+'</button></div></div>';
}
function gearHTML(){
  const F=fx();
  const slots=Object.keys(SLOT).map(k=>{const it=S.equip[k]&&itemById(S.equip[k]);return '<div class="slot"><small>'+SLOT[k]+'</small>'+(it?'<span class="r'+it.r+'">'+esc(it.name)+'</span>':'<span class="muted">未裝備</span>')+'</div>';}).join('');
  return '<section class="sheet stack"><div><div class="eyebrow">Gear</div><h2 class="h">裝備與抽獎</h2></div>'
   +'<div class="row between"><span>持有 <b class="mono">'+S.coins+'</b> 金幣</span><span class="muted mono" style="font-size:12px">普通 55% · 稀有 30% · 史詩 12% · 傳說 3%</span></div>'
   +'<div class="row"><button class="btn" data-act="pull" data-n="1"'+(S.coins<100?' disabled':'')+'>單抽 100</button><button class="btn" data-act="pull" data-n="10"'+(S.coins<900?' disabled':'')+'>十連抽 900</button></div>'
   +'<p class="muted" style="font-size:13px">十連抽至少保底一件稀有以上。重複抽到會換回金幣。裝備只強化戰鬥數值，不會幫你作答。</p>'
   +'<div><div class="eyebrow">目前裝備 · HP 上限 '+(50+F.hp)+'</div><div class="slots">'+slots+'</div></div>'
   +Object.keys(SLOT).map(k=>'<div><div class="eyebrow">'+SLOT[k]+'</div><div class="grid2">'+ITEMS.filter(i=>i.slot===k).map(itemCard).join('')+'</div></div>').join('')
   +'</section>';
}

function achHTML(){
  const done=ACH.filter(a=>S.ach[a.id]).length;
  return '<section class="sheet stack"><div><div class="eyebrow">Achievements</div><h2 class="h">成就 <span class="mono muted" style="font-size:14px">'+done+' / '+ACH.length+'</span></h2></div>'
   +'<div class="grid2">'+ACH.map(a=>{const [c,m]=a.p(S);const d=!!S.ach[a.id];return '<div class="item ach'+(d?' done':'')+'"><div class="nm">'+esc(a.name)+'</div><div class="muted" style="font-size:13px">'+esc(a.desc)+'</div><div class="prog"><i style="width:'+Math.min(100,c/m*100)+'%"></i></div><div class="mono muted" style="font-size:12px">'+Math.min(c,m)+' / '+m+' · 獎勵 '+a.rw+' 金幣</div></div>';}).join('')+'</div>'
   +'<div><button class="btn ghost sm" data-act="resetAsk">重設所有進度</button></div></section>';
}

function checkinHTML(){
  const t=today(),done=S.lastCheckin===t,cs=curStreak();
  const nextStreak=done?S.streak:(cs?cs+1:1);
  const rw=40+10*Math.min(nextStreak-1,6)+(nextStreak%7===0?100:0);
  const wk='日一二三四五六';
  let days='';
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=fmtDate(d);days+='<div class="day'+(S.checkins.includes(s)?' on':'')+(i===0?' today':'')+'">'+wk[d.getDay()]+'<br>'+d.getDate()+'</div>';}
  const dq=S.day.d===t?S.day:{q:0,c:0};
  return '<section class="sheet stack"><div><div class="eyebrow">Daily Check-in</div><h2 class="h">每日打卡</h2></div>'
   +'<div class="stats"><div><small>目前連續</small><span class="num">'+cs+' 天</span></div><div><small>最長連續</small><span class="num">'+S.bestStreak+' 天</span></div><div><small>今日答題</small><span class="num">'+dq.c+'/'+dq.q+'</span></div></div>'
   +'<div class="days">'+days+'</div>'
   +'<button class="btn wide" data-act="checkin"'+(done?' disabled':'')+'>'+(done?'今天已打卡':'打卡領 '+rw+' 金幣')+'</button>'
   +'<p class="muted" style="font-size:13px">獎勵從 40 金幣起跳，連續每多一天 +10（最多 +60），每滿 7 天再加 100。中斷一天就從第 1 天重新算。</p></section>';
}

const VIEWS={lobby:lobbyHTML,wrong:wrongHTML,vocab:vocabHTML,gear:gearHTML,ach:achHTML,checkin:checkinHTML};
function renderTop(){
  $('#chipCoin').textContent='金幣 '+S.coins;
  $('#chipStreak').textContent='連續 '+curStreak()+' 天';
  $('#ckDot').hidden=S.lastCheckin===today();
  document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.v===V)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}
function render(){
  document.body.classList.toggle('inb',!!MODE);
  renderTop();
  if(MODE)return;
  $('#view').innerHTML=VIEWS[V]();
  window.scrollTo(0,0);
}

/* ===== 抽獎 ===== */
function rollRarity(min){
  let r=Math.random()*100,k=r<55?0:r<85?1:r<97?2:3;
  return Math.max(k,min||0);
}
function pull(n){
  const cost=n===10?900:100;
  if(S.coins<cost){toast('金幣不足');return;}
  S.coins-=cost;
  const res=[];
  for(let i=0;i<n;i++){
    let k=rollRarity(0);
    if(n===10&&i===9&&!res.some(x=>x.it.r>=1))k=rollRarity(1);
    const pool=ITEMS.filter(x=>x.r===k);
    const it=pool[Math.floor(Math.random()*pool.length)];
    let dup=false;
    if(S.items[it.id]){dup=true;S.coins+=REFUND[it.r];}
    else{S.items[it.id]=1;if(it.r===3)S.legend=1;}
    res.push({it,dup});
  }
  S.pulls+=n;save();
  dlg('<h2 class="h">抽獎結果</h2><div class="stack" style="gap:8px">'
   +res.map(x=>'<div class="fbline"><span><b class="r'+x.it.r+'">'+RN[x.it.r]+'</b> '+esc(x.it.name)+'</span><span class="mono '+(x.dup?'muted':'g')+'">'+(x.dup?'重複 +'+REFUND[x.it.r]+' 金幣':'NEW')+'</span></div>').join('')
   +'</div><button class="btn" data-act="close">收下</button>');
  checkAch();render();
}

/* ===== 打卡 ===== */
function doCheckin(){
  const t=today();if(S.lastCheckin===t)return;
  const gap=S.lastCheckin?dayDiff(S.lastCheckin,t):99;
  S.streak=gap===1?S.streak+1:1;
  S.bestStreak=Math.max(S.bestStreak,S.streak);
  S.lastCheckin=t;S.checkins.push(t);S.checkins=S.checkins.slice(-60);
  const rw=40+10*Math.min(S.streak-1,6)+(S.streak%7===0?100:0);
  addCoins(rw);save();
  toast('打卡成功：連續 '+S.streak+' 天，+'+rw+' 金幣');
  checkAch();render();
}

/* ===== 事件 ===== */
const ACT={
  nav:t=>{if(MODE)return;V=t.dataset.v;render();},
  pickType:t=>{const k=t.dataset.v,i=S.types.indexOf(k);if(i>=0){if(S.types.length===1){toast('至少要選一種題型');return;}S.types.splice(i,1);}else S.types.push(k);S.types=Object.keys(TYPES).filter(x=>S.types.includes(x));save();render();},
  pickDiff:t=>{S.diff=t.dataset.v;save();render();},
  start:()=>startBattle(),
  ans:t=>{const i=+t.dataset.i;if(MODE==='battle')battleAnswer(i);else if(MODE==='review')reviewAnswer(i);},
  next:()=>{if(B&&!B.over&&B.phase==='resolved')nextQuestion();},
  special:()=>{if(B&&B.phase==='special'&&!B.used)startSpecial();},
  result:()=>showResult(),
  again:()=>{closeDlg();startBattle();},
  lobby:()=>leaveBattle(),
  quit:()=>askQuit(),
  quitYes:()=>quitBattle(),
  close:()=>closeDlg(),
  review:()=>startReview(),
  rvNext:()=>nextReview(),
  rvExit:()=>{MODE=null;RV=null;document.body.classList.remove('inb');render();},
  rvDone:()=>{closeDlg();V='wrong';render();},
  fav:t=>{const i=t.dataset.i;if(S.fav[i])delete S.fav[i];else S.fav[i]=1;save();t.setAttribute('aria-pressed',String(!!S.fav[i]));if(VF.f==='fav'){$('#wlist').innerHTML=wordsHTML();}},
  zh:t=>t.classList.toggle('show'),
  vf:t=>{VF.f=t.dataset.v;render();},
  equip:t=>{const it=itemById(t.dataset.id);if(!it||!S.items[it.id])return;S.equip[it.slot]=S.equip[it.slot]===it.id?null:it.id;save();render();},
  pull:t=>pull(+t.dataset.n),
  checkin:()=>doCheckin(),
  resetAsk:()=>dlg('<h2 class="h">重設所有進度？</h2><p class="muted">金幣、裝備、錯題、成就和打卡紀錄都會清空，無法復原。</p><div class="row"><button class="btn" data-act="resetYes">確定重設</button><button class="btn ghost" data-act="close">取消</button></div>'),
  resetYes:()=>{S=defSave();save();closeDlg();V='lobby';render();toast('已重設');}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',e=>{
  if(e.target.id==='vq'){VF.q=e.target.value;$('#wlist').innerHTML=wordsHTML();}
  if(e.target.id==='vhide'){VF.hide=e.target.checked;$('#wlist').className=VF.hide?'hidezh':'';}
});
render();
checkAch();
</script>

</body></html>
